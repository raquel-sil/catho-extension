<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 320px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111827;
            color: #f3f4f6;
            margin: 0;
        }
        h3 {
            color: #ec4899;
            margin: 0 0 10px 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            width: 100%;
            background-color: #ec4899;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #db2777;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
            color: #9ca3af;
        }
        textarea {
            width: 100%;
            height: 130px;
            margin-top: 10px;
            background: #1f2937;
            color: #10b981;
            border: 1px solid #374151;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            box-sizing: border-box;
            resize: none;
        }
    </style>
</head>
<body>
    <h3>Start RH - Catho Hunter</h3>
    <p style="font-size: 12px; color: #9ca3af; margin-bottom: 12px;">
        Acesse a página de busca da Catho e clique para capturar os currículos visíveis na tela.
    </p>
    
    <button id="btnExtrair" class="btn">Capturar Candidatos</button>
    
    <div id="status">Aguardando ação...</div>
    <textarea id="resultado" placeholder="O JSON dos candidatos aparecerá aqui..." readonly></textarea>

    <script src="popup.js"></script>
</body>
</html>
